<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Vote Arena — Painel</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <!--
    O topo responde às duas perguntas que o operador faz de relance, no meio
    da live: o painel está vivo, e de onde vêm os votos. Antes disso ele era
    uma linha de texto miúdo no canto; agora é a primeira coisa da tela.
  -->
  <header class="topo">
    <div class="topo__marca">
      <span class="topo__icone" aria-hidden="true">🗳️</span>
      <div>
        <h1 class="topo__titulo">Live Vote Arena</h1>
        <p class="topo__sub">Painel do operador — a tela do ar é outra aba</p>
      </div>
    </div>
    <div class="topo__acoes">
      <p class="farol" id="estado" data-estado="conectando">
        <span class="farol__luz" aria-hidden="true"></span>
        <span id="estado-texto">conectando…</span>
      </p>
      <a class="botao botao--fantasma" href="/" target="_blank" rel="noopener">Abrir a tela do ar</a>
    </div>
  </header>

  <!-- Os quatro números que ele olha o tempo todo. Ver admin/medidores.js. -->
  <section class="medidores" id="medidores" aria-label="Estado da votação"></section>

  <nav class="abas" id="abas" role="tablist" aria-label="Seções do painel"></nav>

  <main class="admin__conteudo">
    <p class="ajuda" id="ajuda"></p>
    <div id="secoes"></div>
    <section class="barra" id="barra">
      <p class="barra__recado" id="recado" role="status"></p>
      <button type="button" class="botao botao--principal" id="salvar">Salvar</button>
      <button type="button" class="botao botao--discreto" id="recarregar">Descartar e recarregar</button>
    </section>
  </main>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
